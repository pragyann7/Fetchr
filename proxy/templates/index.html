<!DOCTYPE html>
<html>
<head>
  <title>Postman-Lite (Django)</title>
  <style>
    input, select, textarea, button { margin: 5px 0; padding: 5px; }
    #response { background: #f4f4f4; padding: 10px; white-space: pre-wrap; max-height: 400px; overflow: auto; }
  </style>
</head>
<body>
<h2>Postman-Lite (Django)</h2>

<label>HTTP Method:</label>
<select id="method">
  <option>GET</option>
  <option>POST</option>
  <option>PUT</option>
  <option>DELETE</option>
</select>
<br/>

<label>URL:</label>
<input id="url" placeholder="http://127.0.0.1:8000/api/example" size="50"/>
<br/>

<h4>Authentication</h4>
<select id="authType">
  <option value="none">No Auth</option>
  <option value="basic">Basic</option>
  <option value="bearer">Bearer</option>
</select>
<br/>
<input id="username" placeholder="Username"/>
<input id="password" type="password" placeholder="Password"/>
<input id="token" placeholder="Bearer Token"/>
<br/>

<h4>Raw JSON Body</h4>
<textarea id="body" rows="6" cols="60"></textarea>
<br/>
<button onclick="send()">Send</button>

<h3>Response</h3>
<pre id="response"></pre>

<script>
const authTypeEl = document.getElementById("authType");
const username = document.getElementById("username");
const password = document.getElementById("password");
const token = document.getElementById("token");
const url = document.getElementById("url");
const method = document.getElementById("method");
const body = document.getElementById("body");
const responseEl = document.getElementById("response");

// Show/hide auth fields dynamically
function toggleAuthFields() {
  if(authTypeEl.value === "basic"){
    username.style.display = "inline";
    password.style.display = "inline";
    token.style.display = "none";
  } else if(authTypeEl.value === "bearer"){
    username.style.display = "none";
    password.style.display = "none";
    token.style.display = "inline";
  } else {
    username.style.display = "none";
    password.style.display = "none";
    token.style.display = "none";
  }
}
authTypeEl.addEventListener("change", toggleAuthFields);
toggleAuthFields(); // initial

async function send() {
  let auth = null;

  if(authTypeEl.value === "basic"){
    auth = { type: "basic", username: username.value, password: password.value };
  } else if(authTypeEl.value === "bearer"){
    auth = { type: "bearer", token: token.value };
  }

  // Validate JSON body
  let jsonBody = null;
  if(body.value.trim() !== ""){
    try {
      jsonBody = JSON.parse(body.value);
    } catch(e){
      alert("Invalid JSON: " + e.message);
      return;
    }
  }

  try {
    const res = await fetch("http://127.0.0.1:9000/send/", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        url: url.value,
        method: method.value,
        queryParams: [], // add editor later
        headers: [],     // add editor later
        body: jsonBody,
        auth
      })
    });

    const data = await res.json();

    // Pretty display
    let display = `Status: ${data.status || "Error"}\n\n`;
    if(data.headers) display += `Headers: ${JSON.stringify(data.headers, null, 2)}\n\n`;
    display += `Body:\n${data.body}`;

    responseEl.textContent = display;

  } catch(err) {
    responseEl.textContent = "Request failed:\n" + err;
  }
}
</script>
</body>
</html>
