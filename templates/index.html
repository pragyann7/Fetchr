{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetchr API Client</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Fetchr</h1>
            <p>Local API Testing Tool <span>•</span> Built by <strong>Pragyan Shrestha</strong></p>
        </div>

        <div class="main-grid">
            <div class="section">
                <div class="card">
                    <div class="card-header">
                        <h3>Request</h3>
                        <span class="badge">HTTP</span>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Endpoint</label>
                        <div class="input-group">
                            <select id="method" class="method-select">
                                <option>GET</option>
                                <option>POST</option>
                                <option>PUT</option>
                                <option>DELETE</option>
                                <option>PATCH</option>
                            </select>
                            <input id="url" type="text" placeholder="http://127.0.0.1:8000/api/example">
                        </div>
                    </div>
                    <button id="sendBtn" class="btn-primary">Send Request</button>
                </div>

                <div class="card">
                    <div class="card-header">
                        <h3>Query Parameters</h3>
                        <button class="btn-add" id="addQueryParam">+ Add</button>
                    </div>
                    
                    <div id="queryParamsContainer" class="params-container">
                        <div class="param-row">
                            <input type="checkbox" class="param-enabled" checked>
                            <input type="text" class="param-key" placeholder="Key">
                            <input type="text" class="param-value" placeholder="Value">
                            <button class="btn-remove" title="Remove">×</button>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <h3>Headers</h3>
                        <button class="btn-add" id="addHeader">+ Add</button>
                    </div>
                    
                    <div id="headersContainer" class="params-container">
                        <div class="param-row">
                            <input type="checkbox" class="param-enabled" checked>
                            <input type="text" class="param-key" placeholder="Key">
                            <input type="text" class="param-value" placeholder="Value">
                            <button class="btn-remove" title="Remove">×</button>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <h3>Authentication</h3>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Auth Type</label>
                        <select id="authType">
                            <option value="none">No Authentication</option>
                            <option value="basic">Basic Auth</option>
                            <option value="bearer">Bearer Token</option>
                        </select>
                    </div>

                    <div class="auth-fields">
                        <input id="username" type="text" placeholder="Username">
                        <input id="password" type="password" placeholder="Password">
                        <input id="token" type="text" placeholder="Bearer Token">
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <h3>Request Body</h3>
                        <span class="badge">JSON</span>
                    </div>
                    
                    <textarea id="body" placeholder='{ "key": "value",  "data": "example" }'></textarea>
                </div>
            </div>

            <div class="section">
                <div class="card response-card">
                    <div class="card-header">
                        <h3>Response</h3>
                        <div class="status-indicator" id="statusIndicator">
                            <span class="status-dot"></span>
                            <span id="statusText">Ready</span>
                        </div>
                    </div>

                    <div class="tabs">
                        <button class="tab-btn active" data-tab="body">Body</button>
                        <button class="tab-btn" data-tab="headers">Headers</button>
                    </div>

                    <div id="tab-body" class="tab-content">
                        <div class="empty-state">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                            </svg>
                            <p>Send a request to see the response here</p>
                        </div>
                        <pre id="response-body"></pre>
                    </div>
                    <div id="tab-headers" class="tab-content" style="display:none;">
                        <pre id="response-headers"></pre>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="{% static 'js/app.js' %}"></script>
</body>
</html>
